name: Deploy to GitHub Pages

# Build and publish the site on every push to main (and manually on demand).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy needs to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # keeps CI on the same Node as local (26.4.0)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build # next build -> ./out (output: 'export')

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
